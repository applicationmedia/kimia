<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d35d5">
<title>Media Pembelajaran Interaktif | Sifat Koligatif Larutan</title>
<style>
:root{--purple:#7136d6;--deep:#40208f;--blue:#22a9e8;--pink:#f45bb5;--yellow:#ffd84d;--ink:#202044;--paper:#fffdf8;--muted:#6b6687}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#e6f8ff,#f5eaff 55%,#fff4d7);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}.app{min-height:100vh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(12px,3vw,32px);background:rgba(255,255,255,.88);border-bottom:1px solid #e9ddff;box-shadow:0 5px 22px #5332a014;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--deep)}.brandmark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:23px;box-shadow:0 5px 12px #7136d644}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbtn{padding:9px 12px;border-radius:12px;background:#f1eaff;color:var(--deep);font-weight:800}.toolbtn:hover{background:#e5d7ff}.toolbtn.active{background:#e2f7ff;color:#0874aa}.layout{width:min(1500px,100%);margin:0 auto;padding:18px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;flex:1}.sidebar{background:rgba(255,255,255,.78);border:1px solid #e8dcff;border-radius:22px;padding:14px;align-self:start;box-shadow:0 10px 30px #452a7a10}.side-title{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;padding:5px 8px 12px}.navlist{display:grid;gap:5px;max-height:calc(100vh - 210px);overflow:auto;padding-right:3px}.navitem{display:flex;align-items:center;gap:9px;text-align:left;padding:9px;border-radius:12px;background:transparent;color:#51486e;font-weight:750;font-size:13px}.navitem .num{width:27px;height:27px;border-radius:9px;background:#f0e9ff;color:var(--purple);display:grid;place-items:center;font-weight:900;flex-shrink:0}.navitem:hover{background:#f6f0ff}.navitem.active{background:linear-gradient(100deg,#7136d6,#9859eb);color:#fff;box-shadow:0 5px 14px #7136d633}.navitem.active .num{background:#fff;color:var(--purple)}
.main{min-width:0;display:flex;flex-direction:column;gap:12px}.stage{position:relative;min-height:320px;flex:1;background:#fff;border:1px solid #e8dcff;border-radius:24px;overflow:hidden;box-shadow:0 14px 38px #39206d17;display:flex;align-items:center;justify-content:center}.slide-image{display:block;width:100%;height:auto;max-height:calc(100vh - 190px);object-fit:contain;background:#eaf7ff}.slide-image[hidden]{display:none}.custom-slide{width:100%;min-height:min(66vw,690px);padding:clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;background:radial-gradient(circle at 12% 15%,#d7f6ff,transparent 27%),radial-gradient(circle at 88% 80%,#ffe7f5,transparent 28%),linear-gradient(135deg,#f4faff,#fff7e6);position:relative;overflow:hidden}.custom-slide[hidden]{display:none}.custom-slide:before,.custom-slide:after{content:"✦";position:absolute;color:#ffca37;font-size:70px;opacity:.6}.custom-slide:before{top:20px;right:38px}.custom-slide:after{bottom:10px;left:24px}.eyebrow{display:inline-flex;align-self:flex-start;padding:8px 16px;border-radius:999px;background:#efe4ff;color:#6730c3;font-weight:900;font-size:clamp(12px,1.3vw,16px)}.custom-slide h1{font-size:clamp(28px,4vw,54px);line-height:1.08;color:#5425b4;margin:14px 0 10px}.custom-slide .lead{font-size:clamp(15px,1.8vw,22px);line-height:1.45;color:#51476e;max-width:900px;margin:0 0 22px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.info-card{background:#fff;border:2px solid #e8d9ff;border-radius:20px;padding:18px;box-shadow:0 7px 0 #e9dcff}.info-card .emoji{font-size:clamp(30px,4vw,48px)}.info-card h3{margin:8px 0 6px;color:#6a30c8;font-size:clamp(16px,1.7vw,21px)}.info-card p{margin:0;color:#51476e;line-height:1.4;font-size:clamp(13px,1.3vw,17px)}.formula{display:inline-block;margin-top:12px;background:#fff3bf;color:#55368d;border-radius:12px;padding:9px 13px;font-weight:900}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formula-box{background:#fff;border:2px solid #e5d8ff;border-radius:18px;padding:18px}.formula-box h3{color:#6730c3;margin:0 0 8px}.formula-box p{margin:6px 0;line-height:1.45}.step{background:#f4efff;border-radius:12px;padding:10px 12px;margin:8px 0;font-weight:700;line-height:1.4}.result{background:#e6f8ff;border:2px solid #b8eaff;border-radius:14px;padding:12px;font-weight:900;color:#096d9e;margin-top:10px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.84);border:1px solid #e8dcff;border-radius:18px;padding:10px 14px}.control-group{display:flex;align-items:center;gap:8px}.movebtn{padding:11px 16px;border-radius:13px;background:var(--purple);color:white;font-weight:900;box-shadow:0 4px 0 #4a219d}.movebtn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.movebtn.secondary{background:#eae1ff;color:#5425a8;box-shadow:none}.counter{font-size:13px;color:var(--muted);font-weight:900;white-space:nowrap}.progress{height:7px;background:#e9e0fa;border-radius:99px;overflow:hidden;margin:0 2px}.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--pink));width:5%;transition:width .25s}.footer{padding:0 18px 16px;text-align:center;color:#756d90;font-size:12px}.mobile-select{display:none}
@media(max-width:850px){.layout{grid-template-columns:1fr;padding:10px}.sidebar{padding:10px}.navlist{display:flex;overflow:auto;max-height:none;padding-bottom:2px}.side-title{padding:3px 5px 8px}.navitem{white-space:nowrap;flex-shrink:0}.stage{border-radius:17px}.slide-image{max-height:calc(100vh - 250px)}.custom-slide{min-height:65vh}.topbar{padding:9px 12px}.brand small{display:none}.top-actions .toolbtn{font-size:12px;padding:8px}.footer{padding-bottom:10px}}
@media(max-width:560px){.brand{font-size:13px}.brandmark{width:36px;height:36px}.top-actions{gap:5px}.top-actions .toolbtn{padding:7px 8px;font-size:11px}.layout{gap:9px}.cards,.two-col{grid-template-columns:1fr}.custom-slide{padding:22px 16px}.info-card{padding:13px}.controls{padding:8px;flex-wrap:wrap}.movebtn{padding:10px 12px;font-size:13px}.counter{order:3;width:100%;text-align:center}.control-group{flex:1}.control-group:last-child{justify-content:flex-end}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand"><div class="brandmark">⚗</div><div>MEDIA PEMBELAJARAN<small>SIFAT KOLIGATIF LARUTAN · KIMIA KELAS XII</small></div></div><div class="top-actions"><button class="toolbtn" id="musicBtn" title="Musik latar">♫ Musik: OFF</button><button class="toolbtn" id="soundBtn" title="Efek suara">🔔 Efek: OFF</button><button class="toolbtn" id="fullBtn" title="Layar penuh">⛶ Layar penuh</button></div></header>
<div class="layout"><aside class="sidebar"><div class="side-title">Daftar pembelajaran</div><nav class="navlist" id="navlist"></nav></aside>
<main class="main"><div class="stage" id="stage"><img id="slideImage" class="slide-image" alt="Slide materi pembelajaran"><section id="customSlide" class="custom-slide" hidden></section></div><div class="progress"><span id="progressBar"></span></div><div class="controls"><div class="control-group"><button class="movebtn secondary" id="prevBtn">← Sebelumnya</button></div><div class="counter" id="counter">Slide 1 dari 20</div><div class="control-group"><button class="movebtn" id="nextBtn">Selanjutnya →</button></div></div></main></div><div class="footer">Dikembangkan oleh <b>Evi Febriyanti</b> · A1F025035 · Media pembelajaran interaktif</div></div>
<audio id="bgMusic" src="audio/levvv.mp3" loop preload="none"></audio><audio id="clickSound" src="audio/mouse-klik.mp3" preload="auto"></audio>
<script>
const slides=[
{title:'Cover',img:'assets/Slide1.JPG'},
{title:'Tahukah Kamu?',img:'assets/Slide2.JPG'},
{title:'Pengenalan Sifat Koligatif',img:'assets/Slide3.JPG'},
{title:'Empat Sifat Koligatif',img:'assets/Slide4.JPG'},
{title:'Konsentrasi Larutan',img:'assets/Slide5.JPG'},
{title:'Elektrolit dan Nonelektrolit',img:'assets/Slide6.JPG'},
{title:'Penurunan Tekanan Uap',img:'assets/Slide7.JPG'},
{title:'Kenaikan Titik Didih',img:'assets/Slide8.JPG'},
{title:'Penurunan Titik Beku',img:'assets/Slide9.JPG'},
{title:'Tekanan Osmotik',img:'assets/Slide10.JPG'},
{title:'Penerapan dalam Kehidupan',img:'assets/Slide11.JPG'},
{title:'Ringkasan Rumus',img:'assets/Slide12.JPG'},
{title:'Contoh Soal 1 dan 2',img:'assets/Slide13.JPG'},
{title:'Contoh Soal 3 dan 4',img:'assets/Slide14.JPG'},
{title:'Contoh Soal 5 dan 6',img:'assets/Slide15.JPG'},
{title:'Kuis Evaluasi 1 · Soal 1–5',img:'assets/Slide16.JPG'},
{title:'Kuis Evaluasi 2 · Soal 6–10',img:'assets/Slide17.JPG'},
{title:'Kuis Evaluasi 3 · Soal 11–15',img:'assets/Slide18.JPG'},
{title:'Kuis Evaluasi 4 · Soal 16–20',img:'assets/Slide19.JPG'},
{title:'Profil Pengembang',img:'assets/Slide20.JPG'}
];
let current=0, musicOn=false, soundOn=false;
const nav=document.getElementById('navlist'),img=document.getElementById('slideImage'),custom=document.getElementById('customSlide');
slides.forEach((s,i)=>{const b=document.createElement('button');b.className='navitem';b.innerHTML=`<span class="num">${i+1}</span><span>${s.title}</span>`;b.addEventListener('click',()=>show(i));nav.appendChild(b);});
const bgMusic=document.getElementById('bgMusic');
const clickSound=document.getElementById('clickSound');
function playClick(){if(!soundOn)return;try{clickSound.currentTime=0;clickSound.play().catch(()=>{});}catch(e){}}
img.onerror=()=>{img.hidden=true;custom.hidden=false;custom.innerHTML='<span class=\"eyebrow\">GAMBAR BELUM DITAMBAHKAN</span><h1>Masukkan gambar slide</h1><p class=\"lead\">Simpan gambar dengan nama <b>assets/slide'+(current+1)+'.JPG</b> lalu muat ulang halaman.</p>';};
function show(n){current=Math.max(0,Math.min(slides.length-1,n));const s=slides[current];if(s.img){img.hidden=false;custom.hidden=true;img.src=s.img;}else{img.hidden=true;custom.hidden=false;custom.innerHTML=s.custom;}document.querySelectorAll('.navitem').forEach((b,i)=>b.classList.toggle('active',i===current));document.getElementById('counter').textContent=`Slide ${current+1} dari ${slides.length} · ${s.title}`;document.getElementById('progressBar').style.width=((current+1)/slides.length*100)+'%';document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').textContent=current===slides.length-1?'Kembali ke awal ↺':'Selanjutnya →';nav.children[current].scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});playClick();}
document.getElementById('prevBtn').onclick=()=>show(current-1);document.getElementById('nextBtn').onclick=()=>show(current===slides.length-1?0:current+1);
document.getElementById('fullBtn').onclick=async()=>{const el=document.getElementById('stage');try{if(!document.fullscreenElement)await el.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('Mode layar penuh tidak tersedia pada browser ini.')}};
document.getElementById('soundBtn').onclick=()=>{soundOn=!soundOn;const b=document.getElementById('soundBtn');b.classList.toggle('active',soundOn);b.textContent=soundOn?'🔔 Efek: ON':'🔔 Efek: OFF';if(soundOn)playClick()};
document.getElementById('musicBtn').onclick=async()=>{musicOn=!musicOn;const b=document.getElementById('musicBtn');b.classList.toggle('active',musicOn);b.textContent=musicOn?'♫ Musik: ON':'♫ Musik: OFF';if(musicOn){try{await bgMusic.play();}catch(e){musicOn=false;b.classList.remove('active');b.textContent='♫ Musik: OFF';alert('Musik belum dapat diputar. Pastikan file audio/levvv.mp3 tersedia.')}}else{bgMusic.pause();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){show(current+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(current-1)}else if(e.key==='Home'){show(0)}else if(e.key==='End'){show(slides.length-1)}});
show(0);
</script></body></html>
